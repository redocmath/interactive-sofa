<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gerver Sofa — Dependency Graph</title>
<script src="graph_data.js"></script>
<script src="sofa_data.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d0d0f; font-family: system-ui, sans-serif; overflow: hidden; }
#wrap { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
#stage { position: relative; flex: 1; overflow: hidden; }
#c { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: default; }
#controls {
  padding: 7px 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  background: #0d0d0f;
  border-top: 0.5px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
button {
  font-size: 10px;
  padding: 3px 9px;
  border-radius: 4px;
  border: 0.5px solid rgba(255,255,255,0.15);
  background: transparent;
  color: rgba(255,255,255,0.4);
  cursor: pointer;
}
button.active { background: rgba(56,138,221,0.15); color: #6ab4f5; border-color: rgba(56,138,221,0.45); }
label { font-size: 10px; color: rgba(255,255,255,0.35); display: flex; align-items: center; gap: 4px; }
input[type=range] { width: 60px; accent-color: #6ab4f5; }
#info { font-size: 10px; color: rgba(255,255,255,0.22); margin-left: auto; }
#popup {
  display: none;
  position: absolute;
  z-index: 50;
  width: 260px;
  background: #16161a;
  border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 14px 16px;
  pointer-events: auto;
}
#popup .pt { font-size: 12px; font-weight: 500; color: #e8e6e0; margin-bottom: 6px; }
#popup .tag { font-size: 9px; padding: 2px 6px; border-radius: 2px; letter-spacing: .08em; text-transform: uppercase; display: inline-block; margin-bottom: 8px; }
#popup .pc { font-size: 11px; line-height: 1.6; color: rgba(232,230,224,0.6); }
#popup .deps { margin-top: 8px; padding-top: 8px; border-top: 0.5px solid rgba(255,255,255,0.07); font-size: 9px; color: rgba(255,255,255,0.25); }
#popup .deps span { display: inline-block; margin: 2px; padding: 1px 5px; border: 0.5px solid rgba(255,255,255,0.1); border-radius: 2px; }
#popup .xbtn { position: absolute; top: 10px; right: 11px; background: none; border: none; color: rgba(255,255,255,0.25); cursor: pointer; font-size: 13px; padding: 0; line-height: 1; }
#legend {
  position: absolute;
  bottom: 12px;
  left: 14px;
  pointer-events: none;
}
.leg { display: flex; align-items: center; gap: 6px; font-size: 9px; color: rgba(255,255,255,0.3); margin-bottom: 3px; letter-spacing: .05em; }
.leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="popup">
      <button class="xbtn" id="xbtn">✕</button>
      <div class="pt" id="pt"></div>
      <span class="tag" id="ptag"></span>
      <div class="pc" id="pc"></div>
      <div class="deps" id="pdeps"></div>
    </div>
    <div id="legend">
      <div class="leg"><div class="leg-dot" style="background:#6a9fd8"></div>theorem</div>
      <div class="leg"><div class="leg-dot" style="background:#6dbf8e"></div>lemma</div>
      <div class="leg"><div class="leg-dot" style="background:#d4856a"></div>corollary</div>
      <div class="leg"><div class="leg-dot" style="background:#c4a35a"></div>proposition</div>
      <div class="leg"><div class="leg-dot" style="background:#a08cc8"></div>definition</div>
      <div class="leg"><div class="leg-dot" style="background:#888780"></div>remark</div>
    </div>
  </div>
  <div id="controls">
    <button id="btn-shape" class="active">sofa shape</button>
    <button id="btn-free"  class="active">free force</button>
    <button id="btn-reset">reset</button>
    <label><input type="checkbox" id="chk-links" checked> links</label>
    <label><input type="checkbox" id="chk-outline" checked> outline</label>
    <label>free force <input type="range" id="sl" min="0" max="100" value="45"> <span id="slv">45</span></label>
    <label>boundary ▶sofa <input type="range" id="sl-boundary" min="0" max="400" value="180"> <span id="sl-boundary-v">180</span></label>
    <label>penalty ∑|e\G| <input type="range" id="sl-penalty" min="0" max="400" value="160"> <span id="sl-penalty-v">160</span></label>
    <label>edge α <input type="range" id="sl-ealpha" min="0" max="100" value="18"> <span id="sl-ealpha-v">18</span></label>
    <label>edge width <input type="range" id="sl-ewidth" min="1" max="40" value="5"> <span id="sl-ewidth-v">5</span></label>
    <span id="info"></span>
  </div>
</div>

<script>
const COLOR = {
  thm:  {fill:'#6a9fd8', stroke:'#185FA5', text:'#0a2a50', hi:'#185FA5', tag:'rgba(106,159,216,0.2)', tagT:'#6ab4f5'},
  lem:  {fill:'#6dbf8e', stroke:'#0F6E56', text:'#03281f', hi:'#0F6E56', tag:'rgba(109,191,142,0.2)', tagT:'#6dbf8e'},
  cor:  {fill:'#d4856a', stroke:'#993C1D', text:'#3d1509', hi:'#993C1D', tag:'rgba(212,133,106,0.2)', tagT:'#d4856a'},
  prop: {fill:'#c4a35a', stroke:'#854F0B', text:'#321d03', hi:'#854F0B', tag:'rgba(196,163,90,0.2)',  tagT:'#c4a35a'},
  def:  {fill:'#a08cc8', stroke:'#534AB7', text:'#1c1445', hi:'#534AB7', tag:'rgba(160,140,200,0.2)', tagT:'#a08cc8'},
  rem:  {fill:'#888780', stroke:'#5F5E5A', text:'#222',    hi:'#5F5E5A', tag:'rgba(136,135,128,0.2)', tagT:'#aaa'},
};
const TYPE_NAME = {thm:'Theorem',lem:'Lemma',cor:'Corollary',prop:'Proposition',def:'Definition',rem:'Remark'};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const DPR = devicePixelRatio || 1;
let W, H, SCALE, OX, OY;

// The Mathematica coords go from about x=-2.23 to x=1, y=0 to y=1
// We need to map them to canvas coords
// The sofa spans: xMin=-2.2275, xMax=1.0, yMin=0, yMax=1.0
// We want it centered and scaled nicely
const MATH_X_MIN = -2.2275264588605035;
const MATH_X_MAX = 1.0;
const MATH_Y_MIN = 0.0;
const MATH_Y_MAX = 1.0;
const MATH_W = MATH_X_MAX - MATH_X_MIN;
const MATH_H = MATH_Y_MAX - MATH_Y_MIN;

function mathToCanvas(mx, my) {
  // Normalize to [0,1]
  const nx = (mx - MATH_X_MIN) / MATH_W;
  const ny = (my - MATH_Y_MIN) / MATH_H;
  // Map to canvas with padding
  const PAD = 0.07;
  const availW = W * (1 - 2*PAD);
  const availH = H * (1 - 2*PAD);
  // Fit maintaining aspect ratio
  const fitScale = Math.min(availW / MATH_W, availH / MATH_H);
  const drawW = MATH_W * fitScale;
  const drawH = MATH_H * fitScale;
  const offX = (W - drawW) / 2;
  const offY = (H - drawH) / 2;
  return {
    x: offX + (mx - MATH_X_MIN) * fitScale,
    y: offY + (MATH_Y_MAX - my) * fitScale  // flip Y (math y-up → canvas y-down)
  };
}

function getFitScale() {
  const PAD = 0.07;
  return Math.min(W*(1-2*PAD)/MATH_W, H*(1-2*PAD)/MATH_H);
}

// ── Sofa geometry helpers ──────────────────────────────────────────────────

// Return the current canvas polygon of the sofa (recomputed each frame lazily)
let _sofaPolyCache = null;
let _sofaPolyCacheKey = '';
function getSofaCanvasPoly() {
  const key = W + ',' + H;
  if (_sofaPolyCacheKey === key && _sofaPolyCache) return _sofaPolyCache;
  const fitScale = getFitScale();
  const drawW = MATH_W * fitScale;
  const drawH = MATH_H * fitScale;
  const offX = (W - drawW) / 2;
  const offY = (H - drawH) / 2;
  _sofaPolyCache = MATH_COORDS.map(([mx,my]) => ({
    x: offX + (mx - MATH_X_MIN)*fitScale,
    y: offY + (MATH_Y_MAX - my)*fitScale
  }));
  _sofaPolyCacheKey = key;
  return _sofaPolyCache;
}

// Point-in-polygon (ray casting)
function pointInSofa(px, py) {
  const poly = getSofaCanvasPoly();
  let inside = false;
  for (let i = 0, j = poly.length-1; i < poly.length; j=i++) {
    const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
    if (((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

// Compute total length of an edge segment that lies OUTSIDE the sofa polygon.
// We sample the segment at STEPS sub-segments and sum lengths of those outside.
function edgeLengthOutside(x1,y1,x2,y2,steps) {
  steps = steps || 20;
  const dx=(x2-x1), dy=(y2-y1);
  let outside=0;
  for(let k=0;k<steps;k++){
    const t0=k/steps, t1=(k+1)/steps;
    const mx=(x1+dx*(t0+t1)*0.5), my=(y1+dy*(t0+t1)*0.5);
    if(!pointInSofa(mx,my)){
      const segLen=Math.hypot(dx/steps, dy/steps);
      outside+=segLen;
    }
  }
  return outside;
}

// Closest point on polygon boundary to (px,py), and signed push direction
function closestBoundaryPoint(px, py) {
  const poly = getSofaCanvasPoly();
  let bestDist = Infinity, bestX = px, bestY = py;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const ax=poly[j].x,ay=poly[j].y,bx=poly[i].x,by=poly[i].y;
    const abx=bx-ax,aby=by-ay,apx=px-ax,apy=py-ay;
    const t=Math.max(0,Math.min(1,(apx*abx+apy*aby)/(abx*abx+aby*aby+1e-9)));
    const cx=ax+t*abx,cy=ay+t*aby;
    const d=Math.hypot(px-cx,py-cy);
    if(d<bestDist){bestDist=d;bestX=cx;bestY=cy;}
  }
  return {x:bestX,y:bestY,dist:bestDist};
}

// Boundary force: if a node is OUTSIDE the sofa, push it strongly inward.
// If a node is INSIDE but close to boundary, apply gentle inward nudge.
function computeBoundaryForces() {
  const forces = new Float64Array(NODES.length * 2);
  const fitScale = getFitScale();
  const INNER_MARGIN = fitScale * 0.04; // gentle nudge zone inside boundary
  NODES.forEach((d, i) => {
    if(d===dragging) return;
    const inside = pointInSofa(d.x, d.y);
    const bp = closestBoundaryPoint(d.x, d.y);
    const dx = bp.x - d.x, dy = bp.y - d.y;
    const dist = Math.hypot(dx, dy) || 1;
    if(!inside) {
      // Outside: very strong push, scales quadratically with distance
      const magnitude = Math.max(6.0, dist * 0.8 + dist * dist * 0.02);
      forces[i*2]   = (dx/dist) * magnitude;
      forces[i*2+1] = (dy/dist) * magnitude;
    } else if (dist < INNER_MARGIN) {
      // Inside but near boundary: gentle inward nudge proportional to closeness
      const t = 1 - dist / INNER_MARGIN; // 0 far from wall, 1 at wall
      const magnitude = t * t * 1.5;
      forces[i*2]   = -(dx/dist) * magnitude; // push away from boundary (inward)
      forces[i*2+1] = -(dy/dist) * magnitude;
    }
  });
  return forces;
}

// For each node, compute the net "pull toward sofa interior" force
// from the penalty: gradient of sum_edges |e \ G|.
// We approximate the gradient numerically for each endpoint.
function computePenaltyForces() {
  const forces = new Float64Array(NODES.length * 2); // [fx0,fy0, fx1,fy1, ...]
  const EPS = 5.0;   // wider finite-difference step → longer-range gradient signal
  const STEPS = 16;  // finer sampling for accuracy
  links.forEach(l => {
    const si = NODES.indexOf(l.source), ti = NODES.indexOf(l.target);
    if(si<0||ti<0) return;
    const sx=l.source.x, sy=l.source.y, tx=l.target.x, ty=l.target.y;
    const base = edgeLengthOutside(sx,sy,tx,ty,STEPS);
    // gradient w.r.t. source x
    const dsx = (edgeLengthOutside(sx+EPS,sy,tx,ty,STEPS)-base)/EPS;
    const dsy = (edgeLengthOutside(sx,sy+EPS,tx,ty,STEPS)-base)/EPS;
    const dtx = (edgeLengthOutside(sx,sy,tx+EPS,ty,STEPS)-base)/EPS;
    const dty = (edgeLengthOutside(sx,sy,tx,ty+EPS,STEPS)-base)/EPS;
    // penalty force = -gradient (minimize outside length)
    // scale by how much of the edge is outside (wider range effect)
    const edgeLen = Math.max(1, Math.hypot(tx-sx, ty-sy));
    const outsideFrac = base / edgeLen;
    const rangeBoost = 1.0 + outsideFrac * 3.0; // stronger when edge far outside
    forces[si*2]   -= dsx * rangeBoost;
    forces[si*2+1] -= dsy * rangeBoost;
    forces[ti*2]   -= dtx * rangeBoost;
    forces[ti*2+1] -= dty * rangeBoost;
  });
  return forces;
}

function resize() {
  const stage = document.getElementById('stage');
  W = stage.clientWidth;
  H = stage.clientHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  recomputeTargets();
}

// Build outer boundary (exclude the bottom flat/inner section)
// The polygon goes: left curved edge → top arc → right side → bottom right → bottom flat line
// → inner notch bottom section → back up
// We want ONLY the outer convex boundary for node placement
// Identify the boundary: the "outer" part is the curved portion from
// the left arc and top arc. The bottom flat and inner notch are excluded.
// Strategy: sample the full polygon path, but only keep points where
// the path forms the outer silhouette (large arc portion).

function getOuterBoundaryPoints() {
  // The polygon coords trace: left side (index 0..~60 going left along bottom),
  // then the big left arc and top arc (index ~60..~175), then right arc (175..~220),
  // then bottom right, then bottom flat, then inner bottom curve (lower return path).
  // For boundary nodes, we want the outer curved portion.
  // Heuristic: exclude points where y < 0.03 (these are near-bottom flat/return path)
  const outer = [];
  for (let i = 0; i < MATH_COORDS.length; i++) {
    const [mx, my] = MATH_COORDS[i];
    // Keep points that form the "outer visible boundary" (not near-bottom flat)
    if (my > 0.04) {
      outer.push([mx, my]);
    }
  }
  return outer;
}

const OUTER_PTS = getOuterBoundaryPoints();

const N = NODES.length;
const nodeMap = {};

function recomputeTargets() {
  // Target: uniformly inside sofa bounding box, keep only those inside
  // Build a grid of candidate interior points
  const fitScale = getFitScale();
  const drawW = MATH_W * fitScale;
  const drawH = MATH_H * fitScale;
  const offX = (W - drawW) / 2;
  const offY = (H - drawH) / 2;

  // Interior target grid
  const gridPts = [];
  const GX = 30, GY = 15;
  for(let gy=0;gy<=GY;gy++) for(let gx=0;gx<=GX;gx++) {
    const cx = offX + (gx/GX)*drawW;
    const cy = offY + (gy/GY)*drawH;
    if(pointInSofa(cx,cy)) gridPts.push({x:cx,y:cy});
  }
  // fallback: centroid
  if(gridPts.length===0) {
    const cx = offX+drawW/2, cy = offY+drawH/2;
    for(let i=0;i<N;i++) gridPts.push({x:cx,y:cy});
  }

  NODES.forEach((d, i) => {
    const idx = Math.floor(i * gridPts.length / N) % gridPts.length;
    d.tx = gridPts[idx].x;
    d.ty = gridPts[idx].y;
    if (!d._init) {
      // spread randomly inside sofa
      const pt = gridPts[Math.floor(Math.random()*gridPts.length)];
      d.x = pt.x + (Math.random()-0.5)*20;
      d.y = pt.y + (Math.random()-0.5)*20;
      d.vx = 0; d.vy = 0;
      d._init = true;
    }
  });
}

NODES.forEach(d => { nodeMap[d.id] = d; });
const links = EDGES.map(e => ({
  source: nodeMap[e.source],
  target: nodeMap[e.target],
  type: e.type
})).filter(l => l.source && l.target);

// Dep lists for popup
NODES.forEach(d => {
  d.uses   = links.filter(l => l.source === d).map(l => l.target.id);
  d.usedBy = links.filter(l => l.target === d).map(l => l.source.id);
});

let shapeOn = true, freeOn = true, showLinks = true, showOutline = true;
let shapeStr = 0.45;
let edgeBaseAlpha = 0.18;   // base opacity for non-active edges
let edgeBaseWidth = 0.5;    // base line width multiplier
let penaltyStr = 1.6;       // penalty strength: ∑|e \ G| gradient force
let boundaryStr = 1.8;      // boundary force: push nodes outside sofa inward
let hovered = null, selected = null, dragging = null, dragOx = 0, dragOy = 0;

document.getElementById('btn-shape').onclick = () => { shapeOn = !shapeOn; document.getElementById('btn-shape').classList.toggle('active', shapeOn); };
document.getElementById('btn-free').onclick  = () => { freeOn  = !freeOn;  document.getElementById('btn-free').classList.toggle('active', freeOn); };
document.getElementById('btn-reset').onclick = () => {
  NODES.forEach(d => { d.x=d.tx+(Math.random()-.5)*40; d.y=d.ty+(Math.random()-.5)*40; d.vx=d.vy=0; });
};
document.getElementById('chk-links').onchange = e => showLinks = e.target.checked;
document.getElementById('chk-outline').onchange = e => showOutline = e.target.checked;
document.getElementById('sl').oninput = e => { shapeStr=e.target.value/100; document.getElementById('slv').textContent=e.target.value; };
document.getElementById('sl-boundary').oninput = e => { boundaryStr=e.target.value/100; document.getElementById('sl-boundary-v').textContent=e.target.value; };
document.getElementById('sl-penalty').oninput = e => { penaltyStr=e.target.value/100; document.getElementById('sl-penalty-v').textContent=e.target.value; };
document.getElementById('sl-ealpha').oninput = e => { edgeBaseAlpha=e.target.value/100; document.getElementById('sl-ealpha-v').textContent=e.target.value; };
document.getElementById('sl-ewidth').oninput = e => { edgeBaseWidth=e.target.value/10; document.getElementById('sl-ewidth-v').textContent=e.target.value; };
document.getElementById('xbtn').onclick = () => { document.getElementById('popup').style.display='none'; selected=null; };

function nodeR(d) { return Math.max(4, 4 + d.weight * 0.45); }

function showPopup(node) {
  selected = node;
  const pop = document.getElementById('popup');
  const c = COLOR[node.type] || COLOR.def;
  document.getElementById('pt').textContent = (TYPE_NAME[node.type]||node.type) + ': ' + node.label;
  const tag = document.getElementById('ptag');
  tag.textContent = TYPE_NAME[node.type] || node.type;
  tag.style.background = c.tag;
  tag.style.color = c.tagT;
  document.getElementById('pc').textContent = 'weight: ' + node.weight + ' (in:' + node.indeg + ', out:' + node.outdeg + ')';
  const deps = document.getElementById('pdeps');
  deps.innerHTML = '';
  if (node.usedBy.length) {
    const h = document.createElement('div');
    h.style.cssText = 'font-size:8px;letter-spacing:.08em;color:#444;margin-bottom:3px;';
    h.textContent = 'REFERENCED BY';
    deps.appendChild(h);
    node.usedBy.slice(0,12).forEach(id => {
      const s = document.createElement('span');
      s.textContent = id.replace(/_/g,' ').replace(/-/g,' ');
      deps.appendChild(s);
    });
    if (node.usedBy.length > 12) {
      const s = document.createElement('span');
      s.textContent = '+' + (node.usedBy.length - 12) + ' more';
      deps.appendChild(s);
    }
  }
  if (node.uses.length) {
    const h = document.createElement('div');
    h.style.cssText = 'font-size:8px;letter-spacing:.08em;color:#444;margin:5px 0 3px;';
    h.textContent = 'REFERENCES';
    deps.appendChild(h);
    node.uses.slice(0,12).forEach(id => {
      const s = document.createElement('span');
      s.textContent = id.replace(/_/g,' ').replace(/-/g,' ');
      deps.appendChild(s);
    });
    if (node.uses.length > 12) {
      const s = document.createElement('span');
      s.textContent = '+' + (node.uses.length - 12) + ' more';
      deps.appendChild(s);
    }
  }
  const pw = 260;
  let left = node.x + 14, top = node.y - 20;
  if (left + pw > W - 10) left = node.x - pw - 14;
  top = Math.max(5, Math.min(H - 200, top));
  pop.style.left = left+'px'; pop.style.top = top+'px';
  pop.style.display = 'block';
}

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return { mx: touch.clientX - r.left, my: touch.clientY - r.top };
}
function findNode(mx,my) {
  return NODES.find(d => Math.hypot(d.x-mx,d.y-my) < nodeR(d)+3);
}

canvas.onmousedown = e => {
  const {mx,my} = getPos(e);
  dragging = findNode(mx,my);
  if (dragging) { dragOx=mx-dragging.x; dragOy=my-dragging.y; }
};
canvas.onmousemove = e => {
  const {mx,my} = getPos(e);
  if (dragging) { dragging.x=mx-dragOx; dragging.y=my-dragOy; dragging.vx=dragging.vy=0; canvas.style.cursor='grabbing'; return; }
  hovered = findNode(mx,my)||null;
  canvas.style.cursor = hovered?'pointer':'default';
  document.getElementById('info').textContent = hovered ? hovered.label+' ['+hovered.type+'] w='+hovered.weight : '';
};
canvas.onmouseup = () => { dragging=null; };
canvas.onclick = e => {
  const {mx,my} = getPos(e);
  const nd = findNode(mx,my);
  if (nd) showPopup(nd);
  else { document.getElementById('popup').style.display='none'; selected=null; }
};
canvas.onmouseleave = () => { dragging=null; hovered=null; };

function tick() {
  const alpha = 0.08, damp = 0.68; // stronger damping → settles faster
  if (shapeOn) {
    NODES.forEach(d => {
      if (d===dragging) return;
      d.vx += (d.tx-d.x)*shapeStr*alpha;
      d.vy += (d.ty-d.y)*shapeStr*alpha;
    });
  }
  if (freeOn) {
    links.forEach(l => {
      const dx=l.target.x-l.source.x, dy=l.target.y-l.source.y;
      const dist=Math.hypot(dx,dy)||1;
      const f=(dist-55)/dist*0.025*alpha;
      if(l.source!==dragging){l.source.vx+=dx*f;l.source.vy+=dy*f;}
      if(l.target!==dragging){l.target.vx-=dx*f;l.target.vy-=dy*f;}
    });
    for (let i=0;i<N;i++) {
      for (let j=i+1;j<N;j++) {
        const a=NODES[i],b=NODES[j];
        const dx=b.x-a.x,dy=b.y-a.y;
        const d2=dx*dx+dy*dy+0.1;
        const fd=Math.sqrt(d2);
        // Much stronger repulsion + wider range (longer falloff) to prevent center clumping
        const repulseR = 3200;
        const f=repulseR/d2*alpha/fd;
        if(a!==dragging){a.vx-=dx*f;a.vy-=dy*f;}
        if(b!==dragging){b.vx+=dx*f;b.vy+=dy*f;}
      }
    }
  }
  // Boundary force: strongly push nodes outside sofa back in
  if (boundaryStr > 0.001) {
    const bf = computeBoundaryForces();
    NODES.forEach((d,i) => {
      if(d===dragging) return;
      d.vx += bf[i*2]   * boundaryStr;
      d.vy += bf[i*2+1] * boundaryStr;
    });
  }
  // Penalty force: push nodes so edges stay inside sofa (∑|e \ G|)
  if (penaltyStr > 0.001) {
    const pf = computePenaltyForces();
    NODES.forEach((d,i) => {
      if(d===dragging) return;
      d.vx += pf[i*2]   * penaltyStr * 1.8;
      d.vy += pf[i*2+1] * penaltyStr * 1.8;
    });
  }
  NODES.forEach(d => {
    if(d===dragging)return;
    d.vx*=damp;d.vy*=damp;
    const speed = Math.hypot(d.vx, d.vy);
    if (speed > 12) { d.vx = d.vx/speed*12; d.vy = d.vy/speed*12; }
    d.x+=d.vx;d.y+=d.vy;
  });
}

function drawSofa() {
  const fitScale = getFitScale();
  const PAD = 0.07;
  const drawW = MATH_W * fitScale;
  const drawH = MATH_H * fitScale;
  const offX = (W - drawW) / 2;
  const offY = (H - drawH) / 2;

  ctx.save();
  ctx.beginPath();
  MATH_COORDS.forEach(([mx,my],i) => {
    const cx = offX + (mx - MATH_X_MIN)*fitScale;
    const cy = offY + (MATH_Y_MAX - my)*fitScale;
    i===0 ? ctx.moveTo(cx,cy) : ctx.lineTo(cx,cy);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(100,130,180,0.06)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(100,150,220,0.30)';
  ctx.lineWidth = 1.2;
  ctx.setLineDash([6,4]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawLinks() {
  const focus = hovered || selected;
  links.forEach(l => {
    const active = focus && (l.source===focus||l.target===focus);
    const dim = focus && !active;
    ctx.save();
    ctx.globalAlpha = dim ? edgeBaseAlpha*0.25 : (active ? 0.88 : edgeBaseAlpha);
    const sx=l.source.x,sy=l.source.y,tx=l.target.x,ty=l.target.y;
    const dx=tx-sx,dy=ty-sy,dist=Math.hypot(dx,dy)||1;
    const r=nodeR(l.target)+1;
    const ex=tx-dx/dist*r, ey=ty-dy/dist*r;
    const sx2=sx+dx/dist*(nodeR(l.source)+1), sy2=sy+dy/dist*(nodeR(l.source)+1);

    ctx.beginPath();
    ctx.moveTo(sx2,sy2); ctx.lineTo(ex,ey);
    const outsideFrac = (!active && penaltyStr>0.001)
      ? edgeLengthOutside(sx,sy,tx,ty,8)/Math.max(1,Math.hypot(tx-sx,ty-sy))
      : 0;
    const edgeColor = active ? '#c8a96e'
      : outsideFrac > 0.05
        ? `rgba(220,${Math.round(130*(1-outsideFrac))},80,1)`
        : 'rgba(180,175,165,1)';
    ctx.strokeStyle = edgeColor;
    ctx.lineWidth = active ? 1.4 : (l.type==='solid'? edgeBaseWidth*1.2 : edgeBaseWidth*0.8);
    if (l.type==='dashed') ctx.setLineDash([3,3]);
    else if (l.type==='dotted') ctx.setLineDash([1,4]);
    ctx.stroke();
    ctx.setLineDash([]);

    if (active) {
      const ang=Math.atan2(ey-sy2,ex-sx2);
      ctx.beginPath();
      ctx.moveTo(ex,ey);
      ctx.lineTo(ex-6*Math.cos(ang-0.4),ey-6*Math.sin(ang-0.4));
      ctx.moveTo(ex,ey);
      ctx.lineTo(ex-6*Math.cos(ang+0.4),ey-6*Math.sin(ang+0.4));
      ctx.stroke();
    }
    ctx.restore();
  });
}

function drawNode(d) {
  const c = COLOR[d.type] || COLOR.def;
  const r = nodeR(d);
  const focus = hovered||selected;
  const isHov = d===hovered, isSel = d===selected;
  const isConn = focus && links.some(l=>(l.source===focus&&l.target===d)||(l.target===focus&&l.source===d));
  const dim = focus && !isHov && !isSel && !isConn;

  ctx.save();
  ctx.globalAlpha = dim ? 0.12 : 1.0;

  if (d.weight >= 8 && !dim) {
    ctx.beginPath(); ctx.arc(d.x,d.y,r+4,0,Math.PI*2);
    ctx.strokeStyle = c.fill+'55'; ctx.lineWidth=1.5; ctx.stroke();
  }

  // Red warning ring if node is outside sofa
  if (!dim && !pointInSofa(d.x, d.y)) {
    ctx.beginPath(); ctx.arc(d.x,d.y,r+6,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(255,80,60,0.7)'; ctx.lineWidth=1.5;
    ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
  }

  ctx.beginPath();
  if (d.type==='thm') {
    for(let i=0;i<5;i++){const a=i/5*Math.PI*2-Math.PI/2;i===0?ctx.moveTo(d.x+r*Math.cos(a),d.y+r*Math.sin(a)):ctx.lineTo(d.x+r*Math.cos(a),d.y+r*Math.sin(a));}
    ctx.closePath();
  } else if (d.type==='def') {
    ctx.moveTo(d.x,d.y-r);ctx.lineTo(d.x+r*.88,d.y);ctx.lineTo(d.x,d.y+r);ctx.lineTo(d.x-r*.88,d.y);ctx.closePath();
  } else if (d.type==='rem') {
    ctx.rect(d.x-r*.85,d.y-r*.85,r*1.7,r*1.7);
  } else {
    ctx.arc(d.x,d.y,r,0,Math.PI*2);
  }

  ctx.fillStyle = (isHov||isSel) ? c.hi : c.fill+'55';
  ctx.fill();
  ctx.strokeStyle = c.fill;
  ctx.lineWidth = (isHov||isSel) ? 2 : 0.8;
  ctx.stroke();

  if (r > 6) {
    ctx.fillStyle = (isHov||isSel) ? '#fff' : c.fill;
    ctx.font = `${Math.max(6, r*0.65)}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // Show shortened label
    const words = d.label.split(' ');
    const short = words.length > 2 ? words.slice(0,2).join(' ')+'…' : d.label;
    ctx.fillText(short.substring(0,12), d.x, d.y);
  }
  ctx.restore();
}

function loop() {
  for(let i=0;i<3;i++) tick();
  ctx.clearRect(0,0,W,H);
  if(showOutline) drawSofa();
  if(showLinks) drawLinks();
  NODES.forEach(drawNode);
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => { resize(); });
resize();
loop();
</script>
</body>
</html>
